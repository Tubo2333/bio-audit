rule_id: B1.2-BATC-002_requirement
domain: BATCH
status: active
version: 1
title: "批次校正的必要性判断 / Batch correction requirement"
description: "当存在多个患者/样本来源时, 即使不同患者的细胞在UMAP中混合良好, 也必须进行批次校正评估。忽略批次效应可能导致假阳性DEG (技术差异被误认为生物学差异)。至少应可视化每个批次的细胞分布。"
condition:
  decision_type: batch_correction
  required_context:
    sequencing: 10X_scRNA_seq
  forbidden_context: {}
  context_constraints:
    - "n_patients >= 3"

scoring:
  level_4:
    methods: []
  level_3:
    methods:
      - batch_corrected_with_qc
      - Harmony
      - scVI
    description: "已进行批次校正并QC验证(如kBET/LISI指标)"
  level_2:
    methods:
      - batch_visualized_no_correction
    description: "未做校正但做了批次可视化和评估"
    conditions_when_acceptable: "当批次效应评估(LISI/kBET)显示无显著批次效应时"
  level_1:
    methods:
      - batch_acknowledged_not_handled
    description: "认识到批次效应但未处理 — 风险可控但不理想"
    note: "建议至少做敏感性分析: 有vs无批次校正的结果对比"
  level_0:
    methods:
      - batch_ignored
      - merge_without_checking
    description: "完全忽略批次效应 — 最多样本直接合并, 未做任何批次评估"
    rationale: "批次效应是scRNA-seq最大的技术混淆因素之一, 忽略它 = 不可靠的结论"
  override_n2: {}

evidence:
  - source_type: benchmark_paper
    pmid: "32033589"
    title: "A benchmark of batch-effect correction methods for single-cell RNA sequencing data — Tran et al. 2020, Genome Biology"
    confidence: L-Confirmed
    excerpt: "Batch effects are pervasive in scRNA-seq and must be addressed for valid biological conclusions."
    supports_levels: ["level_3", "level_0"]
  - source_type: method_paper
    pmid: "31024591"
    title: "K-nearest neighbor batch effect estimation (kBET) — Büttner et al. 2019, Nature Methods"
    confidence: L-Evidenced
    excerpt: "kBET provides a quantitative measure of batch effects remaining after correction."
    supports_levels: ["level_3", "level_2"]
conflicts_with: []
