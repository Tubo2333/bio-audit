rule_id: B1.1-BATC-001_integration
domain: BATCH
status: active
version: 1
title: "批次整合方法 / Batch integration method"
description: "多样本/多患者单细胞数据整合必须进行批次校正。Harmony (Korsunsky et al. 2019) 使用迭代软聚类校正, 对10X数据表现优异。scVI 基于深度生成模型, BBKNN 基于k-NN图。选择应根据数据规模和批次复杂度。"
condition:
  decision_type: batch_correction
  required_context:
    sequencing: 10X_scRNA_seq
    has_batch: true
  forbidden_context: {}
  context_constraints:
    - "n_patients >= 2"

scoring:
  level_4:
    methods: []
  level_3:
    methods:
      - Harmony
      - scVI
    description: "Harmony/scVI — 当前最佳批次整合方法"
    rationale: "Tran et al. (2020) 基准测试: Harmony和scVI在保留生物学变异方面表现最佳"
  level_2:
    methods:
      - BBKNN
      - Seurat_CCA
      - fastMNN
    description: "BBKNN/CCA/fastMNN — 有效但在某些场景下不如Harmony"
    conditions_when_acceptable: "BBKNN适用于大型图谱级数据; CCA适用于批次少(2-3)的场景"
  level_1:
    methods:
      - ComBat
      - MNN
    description: "ComBat/MNN — 较旧方法, 对单细胞数据的适应性有限"
    note: "ComBat最初为bulk microarray设计, 对单细胞zero-inflation处理不佳"
  level_0:
    methods:
      - no_integration
      - no_batch_correction
    description: "无批次整合 — 多样本直接合并, 批次效应混淆生物学信号"
    rationale: "当多个患者/批次存在时, 无整合会导致按批次而非细胞类型聚类"
  override_n2: {}

evidence:
  - source_type: benchmark_paper
    pmid: "32033589"
    title: "A benchmark of batch-effect correction methods for single-cell RNA sequencing data — Tran et al. 2020, Genome Biology"
    confidence: L-Confirmed
    excerpt: "Harmony, LIGER, and Seurat 3 performed best among 14 methods benchmarked for scRNA-seq integration."
    supports_levels: ["level_3", "level_2"]
  - source_type: method_paper
    pmid: "31740819"
    title: "Fast, sensitive and accurate integration of single-cell data with Harmony — Korsunsky et al. 2019, Nature Methods"
    confidence: L-Confirmed
    excerpt: "Harmony iteratively soft-clusters cells and corrects for batch effects without requiring explicit batch labels."
    supports_levels: ["level_3"]
conflicts_with: []
