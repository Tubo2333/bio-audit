rule_id: T1.1-TRAJ-001_inference
domain: TRAJECTORY
status: active
version: 1
title: "轨迹推断方法 / Trajectory inference method"
description: "轨迹推断(pseudotime analysis)揭示细胞分化/状态转变过程。monocle3 (基于RNA velocity)和slingshot (基于最小生成树)是最常用的方法。Saelens et al. (2019) 的基准测试显示不同方法适用于不同轨迹拓扑结构(线性/分叉/树/循环)。方法选择应考虑预期的生物学过程(如EMT→分叉, 发育→树)。"
condition:
  decision_type: trajectory_inference
  required_context:
    sequencing: [10X_scRNA_seq, smartseq2]
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    methods: []
  level_3:
    methods:
      - monocle3
      - slingshot_with_topology_check
    description: "monocle3/slingshot — 经广泛验证的轨迹推断方法"
    rationale: "monocle3 基于 RNA velocity 提供方向性; slingshot 稳健处理多种拓扑结构"
  level_2:
    methods:
      - PAGA
      - scVelo
      - diffusion_map
    description: "PAGA/scVelo/diffusion map — 特定场景有效"
    conditions_when_acceptable: "PAGA适合发育图谱; scVelo需要未剪接/剪接reads数据; diffusion map适合连续过程"
  level_1:
    methods:
      - monocle2
      - wishbone
    description: "旧版方法 — monocle2已被monocle3取代; wishbone假设分叉结构"
    note: "monocle2使用不同的统计算法, 已被monocle3取代"
  level_0:
    methods:
      - no_validation
      - wrong_topology
    description: "未验证轨迹拓扑结构与生物学预期的一致性"
    rationale: "如果生物学过程是连续的(EMT), 强行拟合分叉模型会产生虚假分支点"
  override_n2: {}

evidence:
  - source_type: benchmark_paper
    pmid: "30643263"
    title: "A comparison of single-cell trajectory inference methods — Saelens et al. 2019, Nature Biotechnology"
    confidence: L-Confirmed
    excerpt: "No single method outperforms all others; method choice should match expected trajectory topology."
    supports_levels: ["level_3", "level_2"]
  - source_type: method_paper
    pmid: "30834587"
    title: "The dynamics and regulators of cell fate decisions are revealed by pseudotemporal ordering of single cells — Trapnell et al. 2014, Nature Biotechnology"
    confidence: L-Evidenced
    excerpt: "Monocle pioneered pseudotemporal ordering of single cells using reversed graph embedding."
    supports_levels: ["level_3", "level_1"]
conflicts_with: []
