rule_id: G1.2-DEG-002_multiple_testing
domain: DEG
status: active
version: 1
title: "单细胞 DEG 多重检验校正 / scRNA DEG multiple testing correction"
description: "单细胞DEG涉及大量并行检验(每种细胞类型 × 每个基因), 多重检验校正不可省略。Benjamini-Hochberg FDR 控制在5%是通用标准。不校正时, 即使p<0.01也会有大量假阳性(若检验20,000个基因, 期望200个假阳性)。"
condition:
  decision_type: multiple_testing_correction
  required_context:
    sequencing: 10X_scRNA_seq
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    methods: []
  level_3:
    methods:
      - BH
      - BH_FDR
      - Benjamini_Hochberg
    description: "Benjamini-Hochberg FDR — 基因组学标准"
    rationale: "在探索性分析中控制FDR, 平衡发现率和假阳性率"
  level_2:
    methods:
      - Bonferroni
      - BY
    description: "Bonferroni/BY — 更保守, 适合需要极高特异性的场景"
    conditions_when_acceptable: "当假阳性代价极高时(如临床biomarker验证阶段)"
  level_1:
    methods:
      - nominal_p_only
      - p_0_05_no_correction
    description: "仅使用名义p值 — 在多检验场景下不可靠"
    note: "检验20,000个基因 × 8种细胞类型 = 160,000次检验, 不校正会有大量假阳性"
  level_0:
    methods:
      - no_correction
      - visual_selection
    description: "无校正/目视挑选 — DEG列表不可信"
  override_n2: {}

evidence:
  - source_type: method_paper
    pmid: "26813401"
    title: "A survey of best practices for RNA-seq data analysis — Conesa et al. 2016, Genome Biology"
    confidence: L-Confirmed
    excerpt: "Multiple testing correction is essential for high-throughput genomic analyses."
    supports_levels: ["level_3", "level_0"]
  - source_type: benchmark_paper
    pmid: "34433851"
    title: "Confronting false discoveries in single-cell differential expression — Squair et al. 2021, Nature Communications"
    confidence: L-Confirmed
    excerpt: "Proper multiple testing correction is critical for scRNA-seq DEG analysis."
    supports_levels: ["level_3", "level_2"]
conflicts_with: []
