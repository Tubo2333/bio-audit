rule_id: D2.1-DIMR-001_reduction
domain: DIMRED
status: active
version: 1
title: "降维方法 / Dimensionality reduction method"
description: "PCA 是单细胞分析的标准线性降维方法, 为聚类提供去噪的细胞-细胞距离矩阵。UMAP/t-SNE 用于可视化, 不应直接用作聚类的输入。PCA维度选择应基于客观方法(ElbowPlot/JackStraw)而非主观判断或默认值。"
condition:
  decision_type: dim_reduction
  required_context:
    sequencing: 10X_scRNA_seq
    method: PCA
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    methods: []
  level_3:
    methods:
      - PCA_elbow_selection
      - PCA_JackStraw
      - PCA_heatmap_selection
    description: "PCA + 客观选维 — ElbowPlot/JackStraw 确定PC数"
    rationale: "基于统计检验或方差解释率的客观选维, 避免主观偏差"
  level_2:
    methods:
      - PCA_default_30
      - PCA_fixed_50
    description: "PCA默认维度 — 30是Seurat默认, 50对于大型数据集合理"
    conditions_when_acceptable: "当数据集异质性高且ElbowPlot显示缓慢衰减时, 固定50可接受"
  level_1:
    methods:
      - PCA_fixed_10
      - PCA_fixed_15
    description: "PCA维度过低 — 可能丢失稀有细胞类型的信号"
    note: "仅用10个PC可能捕获不到占比<5%的稀有细胞群体的变异"
  level_0:
    methods:
      - tSNE_directly_for_clustering
      - UMAP_directly_for_clustering
    description: "直接用t-SNE/UMAP坐标聚类 — 违反图聚类假设"
    rationale: "t-SNE/UMAP的全局距离结构被扭曲, 不应作为聚类输入"
  override_n2: {}

evidence:
  - source_type: consensus_guideline
    pmid: "31841116"
    title: "Current best practices in single-cell RNA-seq analysis — Luecken & Theis 2019, Mol Syst Biol"
    confidence: L-Confirmed
    excerpt: "PCA is recommended as input for clustering; t-SNE/UMAP for visualization only."
    supports_levels: ["level_3", "level_0"]
  - source_type: method_paper
    pmid: "30643263"
    title: "A comparison of single-cell trajectory inference methods — Saelens et al. 2019, Nature Biotechnology"
    confidence: L-Evidenced
    excerpt: "Dimensionality reduction quality directly impacts downstream trajectory inference."
    supports_levels: ["level_3", "level_2"]
conflicts_with: []
