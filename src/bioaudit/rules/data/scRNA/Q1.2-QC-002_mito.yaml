rule_id: Q1.2-QC-002
domain: QC
status: active
version: 1
title: "线粒体基因阈值 / Mitochondrial gene threshold"
description: "线粒体基因比例过高(>20-25%)指示细胞凋亡或膜破裂。但不同组织/细胞类型的线粒体表达基线不同(心肌>上皮>免疫), 应结合组织类型调整阈值。固定20%对某些组织可能过严, 对另一些可能过松。"
condition:
  decision_type: qc_mito_threshold
  required_context:
    sequencing: 10X_scRNA_seq
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    methods: []
  level_3:
    methods:
      - adaptive_mito_threshold
      - MAD5_mito
    description: "自适应线粒体阈值 — 根据每个样本/组织的Mito%分布动态确定"
    rationale: "不同细胞类型线粒体含量不同, 自适应阈值避免一刀切"
  level_2:
    methods:
      - tissue_adjusted_threshold
    description: "组织特异性固定阈值 — 比全局固定阈值好但仍不如自适应"
    conditions_when_acceptable: "当数据集来自单一同质组织且样本数充足时"
  level_1:
    methods:
      - global_hard_25_percent
      - fixed_mito_25
    description: "全局固定阈值(如25%) — 不考虑组织差异"
    note: "肿瘤样本中高代谢细胞线粒体比例可能天然偏高, 固定阈值可能误删"
  level_0:
    methods:
      - no_mito_filter
      - mito_50_percent
    description: "无线粒体过滤或阈值过高(>50%) — 死细胞/凋亡细胞残留"
  override_n2: {}

evidence:
  - source_type: consensus_guideline
    pmid: "31841116"
    title: "Current best practices in single-cell RNA-seq analysis — Luecken & Theis 2019, Mol Syst Biol"
    confidence: L-Confirmed
    excerpt: "High mitochondrial content (>20-30%) is a strong indicator of damaged/dying cells. Tissue-specific thresholds recommended."
    supports_levels: ["level_3", "level_2", "level_1"]
  - source_type: benchmark_paper
    pmid: "29610479"
    title: "EmptyDrops: distinguishing cells from empty droplets in droplet-based single-cell RNA sequencing data — Lun et al. 2019, Genome Biology"
    confidence: L-Confirmed
    excerpt: "Cell quality metrics including mitochondrial percentage must be considered."
    supports_levels: ["level_2"]
conflicts_with: []
