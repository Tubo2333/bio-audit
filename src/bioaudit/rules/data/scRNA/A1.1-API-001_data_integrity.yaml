rule_id: A1.1-API-001_data_integrity
domain: API
status: active
version: 1
title: "单细胞数据获取的完整性检查 / scRNA data acquisition integrity"
description: "从公共数据库(GEO/ArrayExpress/HCA)获取单细胞数据时, 必须验证数据完整性:基因符号一致性、barcode格式正确、obs/var元数据完整、无空值/重复。不验证可能导致下游分析静默失败(如基因符号映射错误使marker验证失效)。此规则是对pancancer-audit中cBioPortal规则的泛化(D14)。"
condition:
  decision_type: api_data_integrity
  required_context: {}
  forbidden_context: {}
  context_constraints: []

scoring:
  level_4:
    methods: []
  level_3:
    methods:
      - DETAILED_with_validation
      - full_validation
    description: "获取数据后验证: gene符号一致性、barcode非空、obs/var索引完整"
  level_2:
    methods:
      - basic_validation
    description: "只做了基本验证(维度检查)但未深度验证基因符号/barcode"
    conditions_when_acceptable: "当数据来自标准化pipeline(如CellXGene)且格式已知时"
  level_1:
    methods:
      - no_validation
    description: "无验证直接使用 — 可能包含静默错误"
    note: "基因符号映射错误(如'1-Mar'被Excel转为日期'Mar-1')是最常见的静默错误"
  level_0:
    methods:
      - dataset_not_specified
      - wrong_format
    description: "数据来源不明或使用了不兼容的格式进行下游分析"
  override_n2: {}

evidence:
  - source_type: consensus_guideline
    pmid: "31841116"
    title: "Current best practices in single-cell RNA-seq analysis — Luecken & Theis 2019, Mol Syst Biol"
    confidence: L-Confirmed
    excerpt: "Always validate gene symbols, cell barcodes, and metadata when importing scRNA-seq data."
    supports_levels: ["level_3"]
  - source_type: method_paper
    pmid: "32649846"
    title: "Gene name errors: Lessons not learned — Ziemann et al. 2020, PLoS Computational Biology"
    confidence: L-Evidenced
    excerpt: "Gene name conversion errors (e.g., MARCH1 → Mar-1 → 1-Mar) remain pervasive in genomic analyses."
    supports_levels: ["level_3", "level_1"]
conflicts_with: []
