rule_id: P2.3-PROG-001
domain: PROGNOSIS
status: active
version: 1
title: "事件数每变量比 (EPV) / Events Per Variable ratio"
description: "多变量Cox回归模型需要足够的事件数(死亡/复发)来支持估计。EPV<10时模型严重过拟合,回归系数不稳定,HR置信区间极宽。这是样本量不足时最常见的过度解释。"
condition:
  decision_type: events_per_variable
  required_context:
    analysis_type: survival_analysis

scoring:
  level_3:
    methods:
      - EPV_gte_10_verified
      - EPV_gte_15
      - events_per_variable_gte_10
    description: "EPV ≥ 10-15 — 模型稳定"
    rationale: "模拟研究表明EPV≥10-15可以保证Cox回归系数的稳定估计 (Peduzzi et al. 1995; Concato et al. 1995)"
  level_2:
    methods:
      - EPV_5_to_10_with_penalized
      - Firth_penalized_Cox
      - ridge_Cox_low_EPV
    description: "EPV 5-10 但使用惩罚或Firth校正 — 可接受"
    note: "Firth惩罚似然或岭回归Cox在低EPV时提供更稳健的估计"
  level_1:
    methods:
      - EPV_5_to_10_unadjusted
    description: "EPV 5-10 但未做校正 — 有风险"
  level_0:
    methods:
      - EPV_less_than_5
      - EPV_less_than_10_no_correction
      - events_per_variable_low_no_disclosure
    description: "EPV < 5-10 且未披露限制 — 结果不可靠"
    rationale: "当事件数<10/变量时,HR估计偏差显著,模型可能过拟合到数据中的噪声 (Peduzzi et al. 1995)"

evidence:
  - source_type: method_paper
    pmid: "7474269"
    title: "Importance of events per independent variable in proportional hazards regression analysis — Peduzzi et al. 1995, Journal of Clinical Epidemiology"
    confidence: L-Confirmed
    excerpt: "EPV < 10 leads to unstable Cox regression coefficients and inflated Type I error."
    supports_levels: ["level_3", "level_0"]
  - source_type: method_paper
    doi: "10.1002/sim.4780141306"
    title: "A simulation study of the number of events per variable in logistic regression analysis — Peduzzi et al. 1996, Statistics in Medicine"
    confidence: L-Consensus
    excerpt: "At EPV < 10, regression coefficients are biased and confidence intervals are unreliable."
    supports_levels: ["level_0"]
