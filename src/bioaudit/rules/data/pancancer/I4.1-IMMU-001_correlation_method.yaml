rule_id: I4.1-IMMU-001
domain: IMMUNE
status: active
version: 1
title: "免疫-表达相关性方法 / Immune-expression correlation method"
description: "免疫浸润评分与基因表达的相关性分析需选择正确的相关方法。Pearson相关要求双变量正态分布; 免疫评分(如ssGSEA/ESTIMATE)和基因表达(TPM)常呈非正态分布,Spearman秩相关更稳健。方法选择不当产生虚假显著或遗漏真实关联。"
condition:
  decision_type: immune_correlation_method
  required_context:
    analysis_type: immune_expression_correlation

scoring:
  level_3:
    methods:
      - Spearman
      - Spearman_rank_correlation
      - rank_correlation
      - Kendall_tau
    description: "秩相关 — 对非正态分布稳健"
    rationale: "Spearman秩相关不要求正态假设,对离群值稳健,适合免疫评分-基因表达关联分析 (Hollander & Wolfe 1999)"
  level_2:
    methods:
      - Pearson_with_normality_test
      - Pearson_after_transformation
    description: "Pearson但先检验正态性 — 可接受但需证明"
    note: "如果Shapiro-Wilk或QQ图确认双变量正态,或Box-Cox变换后正态,Pearson可以使用"
  level_1:
    methods:
      - Pearson_no_normality_check
      - Pearson_default
    description: "Pearson但未检验正态性 — 可能产生误导性结果"
    rationale: "非正态数据下Pearson相关的p值不可靠,可能夸大显著性 (Kowalski 1972)"
  level_0:
    methods:
      - Pearson_on_clearly_non_normal
      - linear_regression_R2_on_ranks
    description: "已知非正态仍用Pearson — 结论不可靠"

evidence:
  - source_type: method_paper
    title: "Nonparametric Statistical Methods, 3rd ed. — Hollander & Wolfe 1999, Wiley"
    confidence: L-Confirmed
    excerpt: "Spearman rank correlation is robust to non-normality and outliers, making it preferred for non-normal biological data."
    supports_levels: ["level_3"]
  - source_type: method_paper
    pmid: "5043289"
    title: "The effects of nonnormality on the product moment correlation coefficient — Kowalski 1972, Biometrika"
    confidence: L-Consensus
    excerpt: "Pearson correlation p-values are unreliable when the bivariate normality assumption is violated."
    supports_levels: ["level_1", "level_0"]
